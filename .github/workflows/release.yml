name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish src/AudioPresetSwitcher/AudioPresetSwitcher.csproj
          -c Release
          -p:PublishProfile=win-x64
          -p:Version=${{ github.ref_name }}
          --nologo

      - name: Package
        shell: pwsh
        run: |
          $out = "AudioPresetSwitcher-win-x64.zip"
          Compress-Archive -Path "publish/win-x64/AudioPresetSwitcher.exe" -DestinationPath $out -Force
          Get-Item $out | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            AudioPresetSwitcher-win-x64.zip
            publish/win-x64/AudioPresetSwitcher.exe
