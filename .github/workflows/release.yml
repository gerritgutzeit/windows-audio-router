name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $semver = $tag.TrimStart("v")
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "semver=$semver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "tag=$tag semver=$semver"

      - name: Publish
        run: >
          dotnet publish src/AudioPresetSwitcher/AudioPresetSwitcher.csproj
          -c Release
          -p:PublishProfile=win-x64
          -p:Version=${{ steps.version.outputs.semver }}
          --nologo

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Pack and upload Velopack release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "https://github.com/${{ github.repository }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $semver = "${{ steps.version.outputs.semver }}"
          $icon = "src/AudioPresetSwitcher/Assets/app.ico"

          # Previous packages enable delta updates; ignore if this is the first release.
          & vpk download github --repoUrl $repo --token $env:GITHUB_TOKEN -o releases
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous Velopack release to download (first release or empty)."
          }

          & vpk pack `
            -u AudioPresetSwitcher `
            -v $semver `
            -p publish/win-x64 `
            --mainExe AudioPresetSwitcher.exe `
            --packTitle "AudioPresetSwitcher" `
            --icon $icon `
            --shortcuts StartMenu `
            -o releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & vpk upload github `
            --repoUrl $repo `
            --token $env:GITHUB_TOKEN `
            --publish true `
            --tag $tag `
            --releaseName "AudioPresetSwitcher $semver" `
            -o releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
